name: many-rooms

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manyrooms}
      POSTGRES_USER: ${POSTGRES_USER:-manyrooms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup to generate your local password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
